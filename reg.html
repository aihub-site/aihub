  <script src="./AIHUB — Регистрация_files/lucide.min.js.Без названия"></script>
  <script>
    const icons = () => window.lucide && window.lucide.createIcons({attrs:{'stroke-width':1.8}});
    const toast = document.getElementById('auth-toast');
    const showToast = message => {
      toast.textContent = message;
      toast.hidden = false;
      requestAnimationFrame(() => toast.classList.add('visible'));
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { toast.classList.remove('visible'); setTimeout(() => { toast.hidden = true; }, 220); }, 2600);
    };
    document.querySelectorAll('.password-toggle').forEach(button => button.addEventListener('click', () => {
      const input = button.parentElement.querySelector('input');
      input.type = input.type === 'password' ? 'text' : 'password';
      button.innerHTML = `<i data-lucide="${input.type === 'password' ? 'eye' : 'eye-off'}"></i>`;
      icons();
    }));
    document.getElementById('forgot-password')?.addEventListener('click', () => showToast('Восстановление пароля появится в следующем обновлении'));
    icons();

    // ДОБАВЛЕННЫЙ КОД: Перенаправление на страницу AI Workspace
    document.getElementById('auth-form').addEventListener('submit', function(e) {
      e.preventDefault(); // Отменяем стандартную отправку формы на сервер
      window.location.href = 'Workspace.html'; // Переход на нужную страницу
    });
  </script>
