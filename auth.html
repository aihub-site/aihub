<body>
  <main class="auth-layout">
    <section class="auth-aside">
      <a class="auth-brand" href="index.html" aria-label="AIHUB — на главную"><img src="./auth_files/favicon.svg" alt="" style="width: 40px; height: 40px; border-radius: 13px;"><strong>AIHUB</strong></a>
      <a class="auth-back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" aria-hidden="true" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg><span>На главную</span></a>
      <div class="auth-message">
        <div class="auth-liquid" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>Создавайте без переключения между сервисами</h1>
        <p>Текст, изображения и видео — в одном спокойном рабочем пространстве.</p>
      </div>
      <div class="auth-proof"><span class="proof-avatars"><i>М</i><i>А</i><i>К</i></span><p><strong>12 000+</strong> авторов уже используют AIHUB</p></div>
    </section>

    <section class="auth-main">
      <div class="auth-card">
        <div class="auth-copy">
          <span class="auth-mode-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="log-in" aria-hidden="true" class="lucide lucide-log-in"><path d="m10 17 5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg></span>
          <h2>С возвращением</h2>
          <p>Войдите, чтобы продолжить работу</p>
        </div>

        <!-- Блок для вывода ошибок -->
        <div class="auth-error-message" id="auth-error"></div>

        
        <form id="auth-form" method="post" novalidate="">
          <input type="hidden" name="mode" value="login">
          <input type="hidden" name="csrf_token" value="623d39f9514921ec5ddda007801e3764b800739c83c3a15cdfbf68370bb7acda">
                    <label><span>Email</span><input type="email" name="email" id="login-email" value="" placeholder="name@example.com" autocomplete="email" required=""></label>
          <label><span>Пароль</span><span class="password-wrap"><input type="password" name="password" id="login-password" placeholder="Минимум 8 символов" minlength="8" autocomplete="current-password" required=""><button type="button" class="password-toggle" aria-label="Показать пароль"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" aria-hidden="true" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
                      <div class="auth-options"><label class="remember"><input type="checkbox" name="remember" checked=""><span></span>Запомнить меня</label><button type="button" id="forgot-password">Забыли пароль?</button></div>
                    <button class="auth-submit" type="submit"><span>Войти в AIHUB</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" aria-hidden="true" class="lucide lucide-arrow-right"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
        </form>

        <p class="auth-switch">
          Нет аккаунта?          <a href="reg.html">Зарегистрироваться</a>
        </p>
      </div>
    </section>
  </main>

  <div class="auth-toast" id="auth-toast" hidden=""></div>
  <script src="./auth_files/lucide.min.js.Без названия"></script>
  <script>
    const icons = () => window.lucide && window.lucide.createIcons({attrs:{'stroke-width':1.8}});
    const toast = document.getElementById('auth-toast');
    const errorBox = document.getElementById('auth-error');
    
    const showToast = message => {
      toast.textContent = message;
      toast.hidden = false;
      requestAnimationFrame(() => toast.classList.add('visible'));
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { toast.classList.remove('visible'); setTimeout(() => { toast.hidden = true; }, 220); }, 2600);
    };

    // Функция показа ошибки
    const showError = (message) => {
      errorBox.textContent = message;
      errorBox.classList.add('show');
    };

    // Скрываем ошибку при вводе
    const clearError = () => {
      errorBox.classList.remove('show');
    };

    document.querySelectorAll('.password-toggle').forEach(button => button.addEventListener('click', () => {
      const input = button.parentElement.querySelector('input');
      input.type = input.type === 'password' ? 'text' : 'password';
      button.innerHTML = `<i data-lucide="${input.type === 'password' ? 'eye' : 'eye-off'}"></i>`;
      icons();
    }));

    document.getElementById('forgot-password')?.addEventListener('click', () => showToast('Восстановление пароля появится в следующем обновлении'));

    // ЛОГИКА ВХОДА
    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault(); // Отменяем стандартную отправку формы
      
      clearError();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      // Проверка Email по регулярному выражению
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        showError('Введите корректный email.');
        return;
      }

      // Проверка пароля (минимум 8 символов)
      if (password.length < 8) {
        showError('Пароль должен содержать минимум 8 символов.');
        return;
      }

      // Если проверки пройдены - переходим на Workspace.html
      window.location.href = 'Workspace.html';
    });

    // Скрываем ошибку при вводе текста
    document.getElementById('login-email').addEventListener('input', clearError);
    document.getElementById('login-password').addEventListener('input', clearError);

    icons();
  </script>
</body>
